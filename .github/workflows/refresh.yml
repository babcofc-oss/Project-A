name: Refresh public evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "test_*.js"
      - ".github/workflows/refresh.yml"
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: project-a-evidence-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Validate release rules
        run: |
          python3 -m unittest discover -p 'test_*.py'
          for test in test_*.js; do node "$test"; done
      - name: Refresh nationwide and configured SEC sources
        id: refresh
        continue-on-error: true
        env:
          PROJECT_A_USER_AGENT: MOCEAN Briton Barrett britonabarrett@gmail.com
        run: python3 refresh.py
      - name: Verify retained evidence and priority rules
        if: steps.refresh.outcome == 'success'
        run: |
          for test in test_*.js; do node "$test"; done
      - name: Publish snapshot or failure status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json national-discovery.json '*.xml' '*.htm'
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SEC evidence and feed health'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Check production publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 verify_publication.py
      - name: Report failed refresh
        if: steps.refresh.outcome != 'success'
        run: exit 1
